<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>심야 버스 정류장 · 한마디</title>
<meta name="description" content="막차를 기다리는 사람들이 모이는 심야 버스 정류장. 말없이 같이 앉아 있다 가요.">
<meta property="og:title" content="심야 버스 정류장">
<meta property="og:description" content="매일 밤 11시, 막차를 같이 기다려요.">
<style>
:root{--ink:#f3efe6;--dim:#9aa3c4;--gold:#ffd27a;--bg:#0b1026}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
body{display:flex;flex-direction:column;align-items:center;overflow:hidden}
.top{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 6px}
.top h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.2px;flex:1}
.top .cnt{font-size:13px;color:var(--dim);background:rgba(255,255,255,.07);padding:5px 10px;border-radius:14px}
.top .cnt b{color:var(--gold)}
.snd{width:32px;height:32px;border:0;border-radius:16px;background:rgba(255,255,255,.07);color:var(--ink);font-size:15px;padding:0}
.notice{width:100%;max-width:480px;text-align:center;font-size:12.5px;color:var(--dim);padding:0 14px 6px;min-height:22px}
.notice.hot{color:var(--gold);font-weight:700}
.stage{position:relative;width:100%;max-width:480px;aspect-ratio:360/560;flex:0 1 auto;max-height:calc(100dvh - 190px);overflow:hidden}
.stage svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.av{position:absolute;width:8.6%;transform:translate(-50%,-100%);transition:left .6s,top .6s,opacity 1.6s;pointer-events:none}
.av svg{width:100%;display:block;overflow:visible}
.av .me{position:absolute;left:50%;top:-20px;transform:translateX(-50%);font-size:10px;color:var(--gold);white-space:nowrap}
#avs.boarded .av,#avs.boarded .cup{opacity:0}
.bub{position:absolute;left:50%;bottom:112%;transform:translateX(-50%);background:#fff;color:#1c2038;font-size:12px;line-height:1.35;padding:6px 9px;border-radius:12px;max-width:130px;width:max-content;text-align:center;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.35);word-break:keep-all;animation:pop .25s ease-out}
.bub:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.85)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.cup{position:absolute;font-size:15px;transform:translate(-50%,-100%);transition:opacity 1.6s}
#board{position:absolute;left:29.6%;top:52.3%;width:48.2%;height:9.4%;display:grid;grid-template-columns:repeat(3,1fr);gap:3px 4px;padding:3px 4px;background:none;border:0;cursor:pointer;align-content:start;z-index:1}
#board .nt{background:#fff1a8;color:#3a2e10;font-size:8.5px;line-height:1.25;padding:2px 3px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 2px rgba(0,0,0,.4);text-align:left}
#board .nt:nth-child(3n+1){background:#ffd6e0}#board .nt:nth-child(3n+2){background:#d6ecff}
#boardTag{position:absolute;left:29.6%;top:49.4%;font-size:9px;color:#cfd8ff;opacity:.85;pointer-events:none;z-index:1}
#vend{position:absolute;left:5%;top:51%;width:19%;height:25%;background:none;border:0;padding:0;cursor:pointer;z-index:2}
#vend.lit:after{content:"";position:absolute;inset:-8px;border-radius:14px;box-shadow:0 0 22px 6px rgba(255,210,122,.55);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#vendTip{position:absolute;left:3%;top:44%;font-size:11px;color:var(--gold);background:rgba(0,0,0,.45);padding:3px 8px;border-radius:10px;opacity:0;transition:opacity .5s;pointer-events:none;z-index:4}
#vendTip.on{opacity:1}
.win{animation:tw 5s ease-in-out infinite}
@keyframes tw{50%{opacity:.5}}
.bar{width:100%;max-width:480px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.bar input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:var(--ink);padding:0 16px;font-size:15px;outline:none}
.bar input::placeholder{color:#7f89ad}
.bar button{height:44px;border:0;border-radius:22px;background:var(--gold);color:#2a1d05;font-weight:700;font-size:14px;padding:0 18px}
.foot{width:100%;max-width:480px;text-align:center;font-size:11px;color:#6f789c;padding:0 14px calc(8px + env(safe-area-inset-bottom))}
.foot a{color:#8e98c0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{width:100%;max-width:480px;background:#171c38;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:86dvh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:17px}
.sheet .sub{margin:0 0 14px;font-size:13px;color:var(--dim)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;margin-bottom:8px;color:var(--ink);font-size:15px;text-decoration:none}
.item .em{font-size:26px}
.item small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.item.main{background:var(--gold);color:#2a1d05;border:0;font-weight:700}
.item.main small{color:#5b4412}
.notes{list-style:none;margin:0 0 6px;padding:0}
.notes li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:6px;background:#fff1a8;color:#3a2e10;border-radius:4px;font-size:14px}
.notes li:nth-child(3n+1){background:#ffd6e0}.notes li:nth-child(3n+2){background:#d6ecff}
.notes li span{font-size:11px;color:#7a6a40;white-space:nowrap}
.ad{font-size:11px;color:#7f89ad;line-height:1.5;margin:8px 2px 0}
.close{width:100%;height:42px;border:0;background:transparent;color:var(--dim);font-size:14px;margin-top:4px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(255,255,255,.95);color:#1c2038;font-size:13px;padding:9px 15px;border-radius:18px;opacity:0;pointer-events:none;transition:opacity .35s;z-index:30;max-width:88%;text-align:center}
.toast.on{opacity:1}
.gate{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 30%,rgba(255,233,168,.12),transparent 60%),rgba(7,11,31,.94);transition:opacity .9s}
.gate.off{opacity:0;pointer-events:none}
.gate .big{font-size:46px;margin-bottom:4px}
.gate h2{margin:0;font-size:22px;letter-spacing:-.3px}
.gate p{margin:0;color:var(--dim);font-size:14px;line-height:1.6}
.gate p b{color:var(--gold)}
.gate button{margin-top:14px;height:52px;padding:0 30px;border:0;border-radius:26px;background:var(--gold);color:#2a1d05;font-size:16px;font-weight:700;box-shadow:0 0 30px rgba(255,210,122,.35)}
.gate small{color:#6f789c;font-size:12px;margin-top:4px}
</style>
</head>

<script>
/* ===== 설정 ===== */
const TEST = /test/.test(location.hash);           // #test 이면 시험용 방 + 8초 뒤 막차 시연
const TOPIC = 'hanmadi-busstop-v1-k3q9x7' + (TEST ? '-test' : '');
const RELAY = 'https://ntfy.sh/' + TOPIC;          // 실시간 (하트비트·말풍선)
const WALL  = 'https://ntfy.sh/' + TOPIC + '-wall'; // 쪽지·방문 기록 (12시간 보관)
const ACCOUNT = null;            // {bank, no, name} — 공개 여부 대표님 결정 전까지 비움
const DONATE_URL = '';           // 토스 송금 링크 (toss.me/아이디). 비어 있으면 "곧 열려요"
const SHOP = [                   // 쿠팡 파트너스 링크
  {em:'🔥', name:'핫팩·손난로', sub:'추운 밤 정류장 필수템', url:'https://link.coupang.com/a/isijeXPrYy'},
  {em:'😴', name:'목베개', sub:'졸다 고개 꺾이지 않게', url:'https://link.coupang.com/a/isikCrC8hU'},
  {em:'🎧', name:'이어폰', sub:'기다리는 동안 한 곡', url:'https://link.coupang.com/a/isimeBuway'}
];
const COLORS = ['#ef6a5a','#f3a64a','#e8d25a','#7ccf7a','#5ac2c9','#6f9bf0','#a584ea','#ec7fb6'];
const ACTIVE_MS = 55000, HB_MS = 20000, SAY_MS = 9000, GIFT_MS = 600000;
const SEATS = [[135,392],[165,392],[195,392],[225,392]];
const STAND = [[250,438],[285,436],[320,438],[215,440],[160,440],[110,440],[340,432],[130,432]];
const $ = id => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch {} } };

/* ===== 상태 ===== */
const me = {id: Math.random().toString(36).slice(2, 8), c: Math.floor(Math.random() * COLORS.length)};
const users = new Map();     // id -> {c,last,say:{t,ts}}
const gifts = [];            // {i,ts}
const notes = [];            // {t,ts,key}
const visitors = new Set();
let joined = 0, entered = false, lit = false, lastSay = 0, boardedUntil = 0;
users.set(me.id, {c: me.c, last: Date.now()});

/* ===== 중계 (ntfy.sh, 계정 없이 쓰는 무료 공개 중계) ===== */
function pub(url, d){ try { fetch(url, {method:'POST', body: JSON.stringify(d), keepalive:true}).catch(()=>{}); } catch {} }
function addNote(t, ts, key){
  t = clean(t); if (!t || t === '…') return;
  if (notes.some(n => n.key === key)) return;
  notes.push({t, ts, key}); notes.sort((a, b) => a.ts - b.ts); if (notes.length > 200) notes.shift();
  drawBoard();
}
function handle(m, bf){
  if (!m || m.event !== 'message') return;
  let d; try { d = JSON.parse(m.message); } catch { return; }
  if (!d || typeof d.i !== 'string') return;
  visitors.add(d.i);
  if (d.i === me.id) return;
  const ts = (m.time || 0) * 1000 || Date.now();
  if (d.k === 'bye') { users.delete(d.i); return; }
  const u = users.get(d.i) || {c: 0, last: 0};
  u.c = (d.c | 0) % COLORS.length; if (ts > u.last) u.last = ts;
  users.set(d.i, u);
  if (d.k === 'say' && typeof d.t === 'string') {
    u.say = {t: clean(d.t), ts};
    if (!bf) { addNote(d.t, ts, d.i + '|' + d.t); if (entered) Snd.pop(); }
  }
  if (d.k === 'gift') { gifts.push({i: d.i, ts}); if (!bf && Date.now() - ts < 15000) { toast('누군가 따뜻한 커피를 놓고 갔어요 ☕'); Snd.clunk(); } }
}
function handleWall(m){
  if (!m || m.event !== 'message') return;
  let d; try { d = JSON.parse(m.message); } catch { return; }
  if (!d || typeof d.i !== 'string') return;
  visitors.add(d.i);
  if (d.k === 'say' && typeof d.t === 'string') addNote(d.t, (m.time || 0) * 1000, d.i + '|' + d.t);
}
async function poll(url, since, fn){
  try {
    const t = await (await fetch(url + '/json?poll=1&since=' + since)).text();
    t.split('\n').forEach(l => { if (l.trim()) { try { fn(JSON.parse(l)); } catch {} } });
  } catch {}
}
function live(){
  try { const es = new EventSource(RELAY + '/sse'); es.onmessage = e => { try { handle(JSON.parse(e.data), false); } catch {} }; } catch {}
}
function beat(){ if (!entered) return; users.get(me.id).last = Date.now(); pub(RELAY, {k:'hb', i: me.id, c: me.c}); }

/* ===== 문장 거르기 ===== */
const BAD = ['시발','씨발','병신','개새','좆','지랄','섹스','자살','죽어','꺼져','ㅅㅂ','ㅂㅅ','ㅈㄹ'];
function clean(t){
  t = String(t).replace(/\s+/g, ' ').trim().slice(0, 20);
  if (/(https?:|www\.|\.com|\.kr|\.net|@|카톡|오픈채팅|텔레)/i.test(t)) return '…';
  for (const b of BAD) if (t.includes(b)) return '…';
  return t;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ago(ts){ const m = Math.max(0, Math.round((Date.now() - ts) / 60000)); return m < 1 ? '방금' : m < 60 ? m + '분 전' : Math.floor(m / 60) + '시간 전'; }

/* ===== 소리 (WebAudio로 직접 만듦, 파일 없음) ===== */
const Snd = (() => {
  let ctx = null, master = null, on = store.get('stop-snd') !== '0', buzzG = null;
  const noise = s => { const b = ctx.createBuffer(1, ctx.sampleRate * s, ctx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; };
  function loop(buf, type, f, g, q){ const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; if (q) fl.Q.value = q; const gn = ctx.createGain(); gn.gain.value = g; s.connect(fl).connect(gn).connect(master); s.start(); return gn; }
  function burst(dur, type, f0, f1, peak, pan0, pan1){
    if (!ctx) return; const t = ctx.currentTime, s = ctx.createBufferSource(); s.buffer = noise(dur);
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.Q.value = 1.1; fl.frequency.setValueAtTime(f0, t); fl.frequency.linearRampToValueAtTime(f1, t + dur * .5); fl.frequency.linearRampToValueAtTime(f0, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + dur * .45); g.gain.linearRampToValueAtTime(0, t + dur);
    let node = s.connect(fl).connect(g);
    if (ctx.createStereoPanner && pan0 != null) { const p = ctx.createStereoPanner(); p.pan.setValueAtTime(pan0, t); p.pan.linearRampToValueAtTime(pan1, t + dur); node = node.connect(p); }
    node.connect(master); s.start(t); s.stop(t + dur);
  }
  function tone(f, dur, peak, type, at){
    if (!ctx) return; const t = ctx.currentTime + (at || 0), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + .05);
  }
  function engine(dur, peak, pan0, pan1){
    if (!ctx) return; const t = ctx.currentTime, o = ctx.createOscillator(), o2 = ctx.createOscillator(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = 42; o2.type = 'sawtooth'; o2.frequency.value = 63; fl.type = 'lowpass'; fl.frequency.value = 240;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + dur * .4); g.gain.linearRampToValueAtTime(peak * .8, t + dur * .6); g.gain.linearRampToValueAtTime(0, t + dur);
    let node = g; o.connect(fl); o2.connect(fl); fl.connect(g);
    if (ctx.createStereoPanner && pan0 != null) { const p = ctx.createStereoPanner(); p.pan.setValueAtTime(pan0, t); p.pan.linearRampToValueAtTime(pan1, t + dur); node = g.connect(p); }
    node.connect(master); o.start(t); o2.start(t); o.stop(t + dur); o2.stop(t + dur);
    burst(dur, 'lowpass', 160, 260, peak * .9, pan0, pan1);
  }
  function scheduleCar(){ setTimeout(() => { const l = Math.random() < .5; burst(3.2, 'bandpass', 300, 850, .22, l ? -.9 : .9, l ? .9 : -.9); scheduleCar(); }, 12000 + Math.random() * 22000); }
  function flicker(){ setTimeout(() => { const lg = $('lampG'), rf = $('lampRefl'); lg.style.opacity = rf.style.opacity = .35; if (buzzG && ctx) buzzG.gain.setTargetAtTime(.012, ctx.currentTime, .01);
      setTimeout(() => { lg.style.opacity = 1; rf.style.opacity = .8; if (buzzG && ctx) buzzG.gain.setTargetAtTime(.004, ctx.currentTime, .05); }, 90 + Math.random() * 160); flicker(); }, 7000 + Math.random() * 14000); }
  return {
    start(){
      flicker();
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
      master = ctx.createGain(); master.gain.value = on ? 1 : 0; master.connect(ctx.destination);
      const n = noise(3);
      loop(n, 'highpass', 900, .13);           // 빗소리
      loop(n, 'lowpass', 420, .07);            // 젖은 길 웅웅
      const b = ctx.createOscillator(), bf = ctx.createBiquadFilter(); buzzG = ctx.createGain();
      b.type = 'sawtooth'; b.frequency.value = 120; bf.type = 'lowpass'; bf.frequency.value = 500; buzzG.gain.value = .004;
      b.connect(bf).connect(buzzG).connect(master); b.start();   // 가로등 지직
      scheduleCar();
    },
    toggle(){ on = !on; store.set('stop-snd', on ? '1' : '0'); if (master) master.gain.setTargetAtTime(on ? 1 : 0, ctx.currentTime, .1); if (on && ctx && ctx.state === 'suspended') ctx.resume(); return on; },
    get on(){ return on; },
    pass(){ engine(9, .2, -.9, .9); },
    arrive(){ engine(6, .26, -.9, 0); setTimeout(() => burst(1.3, 'highpass', 2600, 3200, .18), 5600); },
    door(){ burst(.8, 'highpass', 2200, 2800, .14); tone(659, .6, .08, 'sine', .5); tone(523, .9, .08, 'sine', .85); },
    leave(){ engine(10, .26, 0, .9); },
    pop(){ tone(880, .12, .05, 'sine'); tone(1175, .1, .03, 'sine', .06); },
    clunk(){ tone(140, .25, .2, 'triangle'); burst(.2, 'bandpass', 900, 1200, .12); }
  };
})();

/* ===== 그리기 ===== */
function avatarSVG(color, sit){
  const body = sit
    ? `<rect x="5" y="20" width="20" height="17" rx="8" fill="${color}"/><rect x="3" y="33" width="24" height="7" rx="3" fill="#222844"/>`
    : `<rect x="5" y="20" width="20" height="20" rx="8" fill="${color}"/><rect x="8" y="38" width="5" height="8" rx="2" fill="#222844"/><rect x="17" y="38" width="5" height="8" rx="2" fill="#222844"/>`;
  return `<svg viewBox="0 0 30 46">${body}<circle cx="15" cy="12" r="9" fill="#f1cfa6"/><path d="M6 11a9 9 0 0 1 18 0c-3-3-6-4-9-4s-6 1-9 4z" fill="#2a2433"/><circle cx="12" cy="13" r="1" fill="#2a2433"/><circle cx="18" cy="13" r="1" fill="#2a2433"/></svg>`;
}
function active(){
  const now = Date.now(), list = [];
  users.forEach((u, id) => { if ((id === me.id && entered) || (id !== me.id && now - u.last < ACTIVE_MS)) list.push([id, u]); });
  list.sort((a, b) => (a[0] === me.id ? -1 : b[0] === me.id ? 1 : a[0] < b[0] ? -1 : 1));
  return list;
}
function drawBoard(){
  const last = notes.slice(-6).reverse();
  $('board').innerHTML = last.map(n => `<div class="nt">${esc(n.t)}</div>`).join('');
  $('tN').textContent = notes.length; $('gT').textContent = notes.length;
}
let sig = '';
function render(){
  const list = active(), now = Date.now();
  $('n').textContent = Math.max(1, list.length); $('gN').textContent = Math.max(1, list.length); $('gV').textContent = Math.max(1, visitors.size);
  const shown = list.slice(0, SEATS.length + STAND.length);
  const s = shown.map(([id]) => id).join(',') + '|' + gifts.filter(g => now - g.ts < GIFT_MS).length;
  const box = $('avs');
  box.classList.toggle('boarded', now < boardedUntil);
  if (s !== sig) {
    sig = s; box.innerHTML = '';
    shown.forEach(([id, u], k) => {
      const sit = k < SEATS.length, p = sit ? SEATS[k] : STAND[k - SEATS.length];
      const el = document.createElement('div'); el.className = 'av'; el.dataset.id = id;
      el.style.left = (p[0] / 360 * 100) + '%'; el.style.top = (p[1] / 560 * 100) + '%';
      el.innerHTML = avatarSVG(COLORS[u.c], sit) + (id === me.id ? '<span class="me">나</span>' : '');
      box.appendChild(el);
    });
    gifts.filter(g => now - g.ts < GIFT_MS).slice(-4).forEach((g, k) => {
      const c = document.createElement('div'); c.className = 'cup'; c.textContent = '☕';
      c.style.left = ((122 + k * 36) / 360 * 100) + '%'; c.style.top = (371 / 560 * 100) + '%'; box.appendChild(c);
    });
  }
  box.querySelectorAll('.av').forEach(el => {
    const u = users.get(el.dataset.id); const b = el.querySelector('.bub');
    const on = u && u.say && now - u.say.ts < SAY_MS;
    if (on && !b) { const d = document.createElement('div'); d.className = 'bub'; d.textContent = u.say.t; el.appendChild(d); }
    else if (!on && b) b.remove();
    else if (on && b && b.textContent !== u.say.t) b.textContent = u.say.t;
  });
  if (entered && !lit && now - joined > 150000) { lit = true; $('vend').classList.add('lit'); $('vendTip').classList.add('on'); setTimeout(() => $('vendTip').classList.remove('on'), 6000); }
  notice(now);
}

/* ===== 막차 시계 (한국 시간 밤 11시) ===== */
function kstMin(now){ const k = new Date(now + 9 * 3600e3); return k.getUTCHours() * 60 + k.getUTCMinutes(); }
function notice(now){
  const hm = kstMin(now), nt = $('notice'), v = Math.max(1, visitors.size);
  let txt, hot = false;
  if (now < boardedUntil) { txt = '🚌 오늘 막차가 떠났어요 · 내일 밤 11시에 또 만나요'; hot = true; }
  else if (hm >= 22 * 60 + 50 && hm < 23 * 60) { const m = 23 * 60 - hm; txt = `🚌 막차가 곧 와요 · ${m}분 남았어요`; hot = true; }
  else if (hm >= 23 * 60 && hm < 23 * 60 + 5) { txt = '🚌 지금 막차 시간이에요'; hot = true; }
  else { const m = hm < 23 * 60 ? 23 * 60 - hm : 24 * 60 - hm + 23 * 60; txt = `막차까지 ${Math.floor(m / 60) ? Math.floor(m / 60) + '시간 ' : ''}${m % 60}분 · 오늘 다녀간 사람 ${v}명`; }
  nt.textContent = txt; nt.classList.toggle('hot', hot);
}

/* ===== 버스 움직임 ===== */
let busy = false;
function move(el, y, x0, x1, ms, ease){
  return new Promise(res => { const t0 = performance.now();
    (function f(t){ let p = Math.min(1, (t - t0) / ms); const e = ease === 'out' ? 1 - Math.pow(1 - p, 3) : ease === 'in' ? p * p * p : p;
      el.setAttribute('transform', `translate(${x0 + (x1 - x0) * e},${y})`); p < 1 ? requestAnimationFrame(f) : res(); })(t0); });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function passBus(){ if (busy || document.hidden) return; busy = true; Snd.pass(); await move($('bus'), 452, -220, 520, 9000); busy = false; }
async function lastBus(){
  while (busy) await wait(500);
  busy = true; const L = $('last');
  Snd.arrive(); await move(L, 446, -260, 104, 6000, 'out');
  await wait(1500); $('door').setAttribute('fill', '#ffe9a8'); Snd.door();
  const n = active().length;
  await wait(2500); boardedUntil = Date.now() + (TEST ? 25000 : 5 * 60000); sig = ''; render();
  await wait(7000); $('door').setAttribute('fill', '#0e2550'); Snd.door();
  toast(n > 1 ? `오늘 막차에 ${n}명이 함께 탔어요 🌙` : '오늘 막차를 타고 갑니다 🌙');
  await wait(2000); Snd.leave(); await move(L, 446, 104, 540, 9000, 'in');
  L.setAttribute('transform', 'translate(-260,446)'); busy = false;
}
function scheduleLast(){
  const now = Date.now(), k = new Date(now + 9 * 3600e3);
  let target = Date.UTC(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate(), 23, 0, 0) - 9 * 3600e3;
  if (now - target > 20000) target += 86400e3;
  setTimeout(() => { lastBus(); setTimeout(scheduleLast, 60000); }, Math.max(0, target - now));
}

/* ===== 비·깊이 ===== */
(function rain(){
  const cv = $('rain'), cx = cv.getContext('2d'); let W = 0, H = 0; const drops = [];
  function size(){ const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); }
  size(); addEventListener('resize', size);
  for (let i = 0; i < 90; i++) drops.push({x: Math.random(), y: Math.random(), v: .6 + Math.random() * .5, l: 8 + Math.random() * 10, a: .15 + Math.random() * .25});
  let last = performance.now();
  (function f(t){ const dt = Math.min(50, t - last) / 1000; last = t; cx.clearRect(0, 0, W, H); cx.lineWidth = 1;
    for (const d of drops) { d.y += d.v * dt * 1.1; d.x -= d.v * dt * .12; if (d.y > 1.02) { d.y = -.05; d.x = Math.random() * 1.1; }
      const x = d.x * W, y = d.y * H; cx.strokeStyle = `rgba(190,205,255,${d.a})`; cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x - d.l * .14, y + d.l); cx.stroke();
      if (d.y > .8 && Math.random() < .01) { cx.fillStyle = 'rgba(190,205,255,.35)'; cx.fillRect(x - 2, y + d.l, 4, 1); } }
    requestAnimationFrame(f); })(last);
})();
let tx = 0, ty = 0, cxp = 0, cyp = 0;
function tilt(x, y){ tx = Math.max(-1, Math.min(1, x)); ty = Math.max(-1, Math.min(1, y)); }
addEventListener('mousemove', e => tilt(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1));
function onOrient(e){ if (e.gamma != null) tilt(e.gamma / 30, ((e.beta || 45) - 45) / 30); }
(function para(){ cxp += (tx - cxp) * .06; cyp += (ty - cyp) * .06;
  $('far').setAttribute('transform', `translate(${-cxp * 4},${-cyp * 3})`); $('mid').setAttribute('transform', `translate(${-cxp * 9},${-cyp * 4})`);
  requestAnimationFrame(para); })();

/* ===== 쪽지 ===== */
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const t = clean($('msg').value); if (!t || t === '…') { $('msg').value = ''; return toast('그 말은 붙일 수 없어요'); }
  if (Date.now() - lastSay < 8000) return toast('잠깐 쉬었다 남겨 주세요');
  lastSay = Date.now();
  const u = users.get(me.id); u.say = {t, ts: Date.now()};
  pub(RELAY, {k:'say', i: me.id, c: me.c, t}); pub(WALL, {k:'say', i: me.id, t});
  addNote(t, Date.now(), me.id + '|' + t); Snd.pop();
  $('msg').value = ''; render();
});
$('board').onclick = () => {
  const list = notes.slice().reverse().slice(0, 60);
  $('sheet').innerHTML = `<h2>📝 오늘 밤 정류장 쪽지</h2><p class="sub">다녀간 사람들이 붙여 두고 간 한 줄이에요</p>
    ${list.length ? '<ul class="notes">' + list.map(n => `<li>${esc(n.t)}<span>${ago(n.ts)}</span></li>`).join('') + '</ul>' : '<p class="sub">아직 쪽지가 없어요. 첫 쪽지를 붙여 주세요.</p>'}
    <button class="close" id="close">닫기</button>`;
  $('modal').classList.add('on'); $('close').onclick = () => $('modal').classList.remove('on');
};

/* ===== 자판기 ===== */
function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2800); }
function openVend(){
  const sh = $('sheet');
  const shop = SHOP.map(s => s.url
    ? `<a class="item" href="${s.url}" target="_blank" rel="noopener sponsored"><span class="em">${s.em}</span><span>${s.name}<small>${s.sub}</small></span></a>`
    : '').join('');
  sh.innerHTML = `<h2>🥫 자판기</h2><p class="sub">따뜻한 걸로 한 잔 뽑아 가세요</p>
    <button class="item main" id="coffee"><span class="em">☕</span><span>따뜻한 캔커피 뽑아 주기<small>정류장에 앉은 모두에게 커피가 놓여요</small></span></button>
    ${shop ? '<p class="sub" style="margin:12px 0 8px">기다리는 밤에 쓸 만한 것</p>' + shop + '<p class="ad">이 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>' : ''}
    <button class="close" id="close">닫기</button>`;
  $('modal').classList.add('on');
  $('close').onclick = () => $('modal').classList.remove('on');
  $('coffee').onclick = () => {
    if (!DONATE_URL && !ACCOUNT) return toast('커피 자판기는 곧 열려요');
    if (DONATE_URL) window.open(DONATE_URL, '_blank', 'noopener');
    const acct = DONATE_URL ? '' : `<p class="sub" style="margin:8px 0"><b>${ACCOUNT.bank} ${ACCOUNT.no}</b><br>예금주 ${ACCOUNT.name}</p>
      <button class="item" id="copy"><span class="em">📋</span><span>계좌번호 복사하기<small>금액은 마음 가는 만큼이면 충분해요</small></span></button>`;
    sh.innerHTML = `<h2>☕ 커피 뽑으셨어요?</h2><p class="sub">송금을 마치셨다면 정류장에 커피를 놓아 드릴게요.</p>${acct}
      <button class="item main" id="done"><span class="em">🙌</span><span>네, 커피를 놓을게요</span></button><button class="close" id="close2">아직이에요</button>`;
    if ($('copy')) $('copy').onclick = () => { try { navigator.clipboard.writeText(ACCOUNT.no); toast('계좌번호를 복사했어요'); } catch { toast('번호를 길게 눌러 복사해 주세요'); } };
    $('close2').onclick = () => $('modal').classList.remove('on');
    $('done').onclick = () => { gifts.push({i: me.id, ts: Date.now()}); pub(RELAY, {k:'gift', i: me.id}); $('modal').classList.remove('on'); toast('따뜻한 커피를 놓았어요 ☕'); Snd.clunk(); render(); };
  };
}
$('vend').onclick = openVend;
$('modal').addEventListener('click', e => { if (e.target === $('modal')) $('modal').classList.remove('on'); });
$('snd').textContent = Snd.on ? '🔊' : '🔇';
$('snd').onclick = () => { $('snd').textContent = Snd.toggle() ? '🔊' : '🔇'; };

/* ===== 들어가기 ===== */
$('enter').onclick = async () => {
  if (entered) return; entered = true; joined = Date.now();
  Snd.start();
  try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) { if (await DeviceOrientationEvent.requestPermission() === 'granted') addEventListener('deviceorientation', onOrient); } else addEventListener('deviceorientation', onOrient); } catch {}
  $('gate').classList.add('off');
  visitors.add(me.id);
  try { if (!sessionStorage.getItem('stop-in')) { sessionStorage.setItem('stop-in', '1'); pub(WALL, {k:'in', i: me.id}); } } catch { pub(WALL, {k:'in', i: me.id}); }
  beat(); sig = ''; render();
  setTimeout(() => { passBus(); setInterval(passBus, 80000); }, 15000);
  if (TEST) setTimeout(lastBus, 8000);
};

/* ===== 시작 ===== */
Promise.all([poll(RELAY, '10m', m => handle(m, true)), poll(WALL, '12h', handleWall)]).then(() => { live(); drawBoard(); render(); });
scheduleLast();
setInterval(beat, HB_MS);
setInterval(render, 1000);
addEventListener('pagehide', () => { if (entered) try { navigator.sendBeacon(RELAY, JSON.stringify({k:'bye', i: me.id})); } catch {} });
render();
</script>
